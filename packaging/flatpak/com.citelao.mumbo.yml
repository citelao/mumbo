app-id: com.citelao.mumbo
runtime: org.gnome.Platform
# GNOME is the only Flathub runtime that ships webkit2gtk-4.1, which Tauri
# renders with on Linux.
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: mumbo

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: mumbo
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      # Lets cargo and npm download dependencies during the build. Flathub
      # requires offline builds: its manifest (in a flathub/com.citelao.mumbo
      # repo) will instead vendor them via flatpak-cargo-generator and
      # flatpak-node-generator and drop this.
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/mumbo/cargo
        # flatpak-builder splits debug info out into com.citelao.mumbo.Debug
        CARGO_PROFILE_RELEASE_DEBUG: "true"
    build-commands:
      - npm ci
      - npm run build
      # `tauri build` normally adds `custom-protocol`; without it the binary is
      # compiled in dev mode and tries to load the dev server URL.
      - cargo build --release --locked -p mumbo --features tauri/custom-protocol
      - install -Dm755 target/release/mumbo /app/bin/mumbo
      - install -Dm644 packaging/flatpak/com.citelao.mumbo.desktop /app/share/applications/com.citelao.mumbo.desktop
      - install -Dm644 packaging/flatpak/com.citelao.mumbo.metainfo.xml /app/share/metainfo/com.citelao.mumbo.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.citelao.mumbo.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.citelao.mumbo.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.citelao.mumbo.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.citelao.mumbo.png
    sources:
      - type: dir
        path: ../..
        # Local build output; copying it in would be slow and could leak
        # host-built artifacts into the flatpak.
        skip:
          - target
          - node_modules
          - dist
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
