[package]
name = "mumble-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", features = ["sink"] }
log = "0.4.34"
prost = "0.14.4"
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "macros", "time", "sync", "rt", "io-util"] }
tokio-rustls = "0.26.6"
tokio-util = { version = "0.7.20", features = ["codec"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt", "test-util"] }
