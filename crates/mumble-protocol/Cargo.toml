[package]
name = "mumble-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio-util = { version = "0.7.20", features = ["codec"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"

[dev-dependencies]
serde_json = "1.0.154"
