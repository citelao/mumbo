[package]
name = "mumbo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mumbo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mumble-protocol = { path = "../crates/mumble-protocol" }
tokio = { version = "1.53.3", features = ["macros", "net", "time"] }
log = "0.4.34"
tauri-plugin-log = { version = "2.10.1", features = ["colored"] }
tokio-rustls = "0.26.6"
rustls = "0.23.46"
bytes = "1.12.1"
tokio-util = { version = "0.7.20", features = ["codec"] }
futures-util = { version = "0.3.34", features = ["sink"] }
opus = "0.4.0"
cpal = "0.18.2"
ringbuf = "0.5.3"
neteq = { version = "0.9.1", default-features = false }
tauri-plugin-store = "2"
rubato = "5.0.1"
sonora = "0.2.0"
# sonora's internal voice detector, which sonora itself doesn't expose.
sonora-agc2 = "0.2.0"
sonora-simd = "0.2.0"
thiserror = "2.0.21"
nnnoiseless = { version = "0.5.2", default-features = false }


[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt"] }
