services:
  mumble-server:
    image: docker.io/mumblevoip/mumble-server:latest
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp" # forward, even though we only use TCP.
    environment:
      MUMBLE_SUPERUSER_PASSWORD: "superuser"
      MUMBLE_CONFIG_SERVERPASSWORD: "test"
      MUMBLE_CONFIG_WELCOMETEXT: "Welcome to the server!<br />Thanks for joining!"
      # Tests and quick reconnects open many connections from one IP, which would
      # trip the server's global autoban (10 in 120 s by default). 0 disables it.
      MUMBLE_CONFIG_AUTOBANATTEMPTS: "0"