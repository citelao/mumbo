name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  rust:
    strategy:
      fail-fast: false
      matrix:
        # Windows catches CRLF checkouts and MSVC-built audio code; macOS is
        # left out because that's where we develop.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `tauri::generate_context!` requires `frontendDist` (../dist) to exist at
      # compile time. Use `vite build` directly rather than `npm run build` so
      # type errors are reported by the frontend job instead of breaking this one.
      - name: Build frontend assets
        run: |
          npm ci
          npx vite build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --locked
      # Lints don't vary by OS; once is enough.
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Builds the app bundle for each platform, catching failures tests don't
  # (bundling, Info.plist merging, release-mode compile, platform-only code).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the .app: the .dmg step scripts Finder, which is unreliable on CI.
          - os: macos-latest
            bundles: app
          - os: ubuntu-latest
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `tauri build` runs `npm run build` (tsc + vite) first. Bash on every OS:
      # Windows' default PowerShell can swallow the `--` before cargo's args.
      - run: npx tauri build --bundles ${{ matrix.bundles }} -- --locked
        shell: bash
