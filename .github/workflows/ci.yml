name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  rust:
    strategy:
      fail-fast: false
      matrix:
        # Test on:
        # - Windows (catches CRLF checkouts & MSVC-built audio code)
        # - macOS
        # - Ubuntu latest (catches breaks from newer system libraries) and
        #   22.04 (oldest LTS with support, ending May 2027)
        os: [ubuntu-22.04, ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `tauri::generate_context!` requires `frontendDist` (../dist) to exist at
      # compile time. Use `vite build` directly rather than `npm run build` so
      # type errors are reported by the frontend job instead of breaking this one.
      - name: Build frontend assets
        run: |
          npm ci
          npx vite build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Key on the exact runner: the default key only has "Linux", so 22.04
      # jobs would reuse C objects built against a newer glibc.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - run: cargo test --workspace --locked
      # Lints don't vary by OS; once is enough.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Tests marked `#[ignore]` because they need a live Mumble server (e.g.
  # sending audio and images between two clients), against the same server
  # image as dev/mumble-server. Linux only: service containers need a Linux
  # runner, and what these test doesn't vary by OS.
  e2e:
    runs-on: ubuntu-latest
    services:
      mumble-server:
        # Keep in sync with dev/mumble-server/compose.yaml.
        image: docker.io/mumblevoip/mumble-server:v1.5.915
        ports:
          - 64738:64738/tcp
          - 64738:64738/udp
        env:
          MUMBLE_SUPERUSER_PASSWORD: superuser
          MUMBLE_CONFIG_SERVERPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # `tauri::generate_context!` needs ../dist; see the rust job.
      - name: Build frontend assets
        run: |
          npm ci
          npx vite build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      # The container reports started before the server is listening.
      - name: Wait for the Mumble server
        run: timeout 60 bash -c 'until nc -z localhost 64738; do sleep 1; done'
      - run: cargo test --workspace --locked -- --ignored
      - run: cargo run -p text-message-tester --locked

  # Builds the app bundle for each platform, catching failures tests don't
  # (bundling, Info.plist merging, release-mode compile, platform-only code).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the .app: the .dmg step scripts Finder, which is unreliable on CI.
          - os: macos-latest
            bundles: app
          - os: ubuntu-22.04
            bundles: deb
          - os: ubuntu-24.04-arm
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      # Key on the exact runner: the default key only has "Linux", so 22.04
      # jobs would reuse C objects built against a newer glibc.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # `tauri build` runs `npm run build` (tsc + vite) first. Bash on every OS:
      # Windows' default PowerShell can swallow the `--` before cargo's args.
      - run: npx tauri build --bundles ${{ matrix.bundles }} -- --locked
        shell: bash

  # Builds the flatpak from source in the GNOME SDK, as the release does.
  flatpak:
    runs-on: ubuntu-latest
    container:
      # Keep in sync with `runtime-version` in the manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: mumbo.flatpak
          manifest-path: packaging/flatpak/com.citelao.mumbo.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**', 'Cargo.lock', 'package-lock.json') }}
          upload-artifact: false
