name: Install Linux dependencies
description: System packages needed to compile the Tauri app on Ubuntu.
runs:
  using: composite
  steps:
    # Tauri v2 Linux prerequisites, plus ALSA headers for cpal, dbus headers
    # for tao, and cmake for building libopus (opusic-sys).
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          cmake \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          libdbus-1-dev \
          libasound2-dev
